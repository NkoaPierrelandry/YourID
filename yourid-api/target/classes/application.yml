spring:
  application:
    name: yourid-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yourid}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USER:yourid}
    password: ${DB_PASSWORD:yourid}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${BREVO_SMTP_LOGIN:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

    servlet:
      multipart:
        max-file-size: 210MB
        max-request-size: 210MB

server:
  port: ${PORT:4000}
  servlet:
    context-path: /

app:
  cors:
    allowed-origins: ${APP_URL:http://localhost:3000},http://localhost:3001
  jwt:
    secret: ${JWT_ACCESS_SECRET:changeme-dev-secret-changeme-dev-secret-min-32-chars}
    access-token-expiration: ${JWT_ACCESS_EXPIRES:2h}
    max-session: ${JWT_MAX_SESSION:7d}
    refresh-secret: ${JWT_REFRESH_SECRET:unused}
    refresh-expiration: ${JWT_REFRESH_EXPIRES:7d}
  uploads:
    dir: ${UPLOAD_DIR:./uploads}
  mail:
    from: ${BREVO_SENDER_EMAIL:no-reply@yourid.app}
    from-name: ${BREVO_SENDER_NAME:Your ID}
  platform:
    fee-percentage: ${PLATFORM_FEE_PERCENT:15}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  content:
    dir: ${CONTENT_DIR:./content-private}
  frontend-url: ${APP_URL:http://localhost:3000}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html