<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — YourID</title>
  <link rel="stylesheet" href="/assets/css/base/tokens.css">
  <link rel="stylesheet" href="/assets/css/base/components.css">
  <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="grid-template-columns:1fr; max-width:440px;">
      <div class="auth-form-panel">
        <div class="auth-header">
          <div class="auth-header-mark">YI</div>
          <div><h1 class="auth-title">Nouveau mot de passe</h1></div>
        </div>

        <div id="error-box" class="auth-error-box"></div>

        <form id="reset-form">
          <div class="auth-field">
            <label class="label" for="password">Nouveau mot de passe</label>
            <input class="input" type="password" id="password" minlength="8" required>
          </div>
          <button class="btn-primary" type="submit" id="submit-btn" style="width:100%;">Réinitialiser</button>
        </form>
      </div>
    </div>
  </div>

  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/page-transition.js"></script>
  <script src="/assets/js/core/password-toggle.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      const eb = document.getElementById('error-box');
      eb.textContent = 'Lien invalide : jeton manquant.';
      eb.classList.add('visible');
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      errorBox.classList.remove('visible');
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      try {
        await api.post('/auth/reset-password',
          { token, password: document.getElementById('password').value },
          { skipAuth: true });
        alert('Mot de passe réinitialisé. Vous pouvez vous connecter.');
        window.location.href = '/auth/login.html';   // ← corrigé
      } catch (err) {
        errorBox.textContent = err.status === 404
          ? "Cette route n'est pas encore implémentée côté backend (voir note de livraison)."
          : (err.message || 'Une erreur est survenue.');
        errorBox.classList.add('visible');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
