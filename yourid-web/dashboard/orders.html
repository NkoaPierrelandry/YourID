<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commandes - YourID</title>
  <link rel="stylesheet" href="/assets/css/base/tokens.css">
  <link rel="stylesheet" href="/assets/css/base/components.css">
  <link rel="stylesheet" href="/assets/css/layouts/dashboard.css">
</head>
<body>
  <div class="dash-shell">
    <aside id="sidebar-root"></aside>
    <div class="dash-main">
      <header id="header-root"></header>
      <main class="dash-content">

        <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px;">
          <div>
            <h1 class="page-title">Gestion des commandes</h1>
            <p style="color:var(--text-muted); margin-top:4px; font-size:14px;">Suivi des transactions et écritures comptables.</p>
          </div>
          <button id="export-btn" class="btn-secondary" style="padding:8px 16px; font-size:13px;" disabled>
            Exporter en CSV
          </button>
        </div>

        <div class="toolbar-card">
          <div class="search-input-wrap">
            <span id="search-icon" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94A3B8; display:flex;"></span>
            <input class="input" type="text" id="search-input" placeholder="Rechercher par n° commande, client, email...">
          </div>
          <select class="select-control" id="status-filter" style="max-width:200px;">
            <option value="all">Tous les statuts</option>
            <option value="PENDING">En attente</option>
            <option value="COMPLETED">Complétée</option>
            <option value="REFUNDED">Remboursée</option>
          </select>
        </div>

        <div class="card" style="padding:0; overflow:hidden;">
          <div style="overflow-x:auto;">
            <table class="dash-table" id="orders-table">
              <thead>
                <tr><th>Commande</th><th>Client</th><th>Articles</th><th>Montant</th><th>Statut</th><th>Date</th></tr>
              </thead>
              <tbody id="orders-tbody">
                <tr><td colspan="6"><div class="skeleton" style="height:40px;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <dialog id="order-dialog" class="product-dialog" style="max-width:460px;">
    <div class="pd-header">
      <h3 class="section-title" style="font-size:17px;">Détail de la commande</h3>
      <button type="button" id="order-dialog-close" style="border:none; background:none; font-size:20px; color:var(--text-muted);">&times;</button>
    </div>
    <div class="pd-body" id="order-dialog-body"></div>
  </dialog>

  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/icons.js"></script>
  <script src="/assets/js/core/page-transition.js"></script>
  <script src="/assets/js/components/dashboard-shell.js"></script>
  <script src="/assets/js/pages/dashboard/orders.js"></script>
</body>
</html>
