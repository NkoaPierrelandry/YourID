<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — YourID</title>
  <link rel="stylesheet" href="/assets/css/base/tokens.css">
  <link rel="stylesheet" href="/assets/css/base/components.css">
  <link rel="stylesheet" href="/assets/css/pages/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card" style="grid-template-columns:1fr; max-width:440px;">
      <div class="auth-form-panel">
        <div class="auth-header">
          <div class="auth-header-mark">YI</div>
          <div>
            <h1 class="auth-title">Mot de passe oublié</h1>
            <p class="auth-subtitle">On vous envoie un lien de réinitialisation</p>
          </div>
        </div>

        <div id="error-box" class="auth-error-box"></div>
        <div id="success-box" class="auth-error-box" style="background:#F0FDF4; border-color:#BBF7D0; color:#15803D;"></div>

        <form id="forgot-form">
          <div class="auth-field">
            <label class="label" for="email">Email</label>
            <input class="input" type="email" id="email" required>
          </div>
          <button class="btn-primary" type="submit" id="submit-btn" style="width:100%;">Envoyer le lien</button>
        </form>

        <p class="auth-footer"><a class="auth-link" href="/auth/login.html">← Retour à la connexion</a></p>
      </div>
    </div>
  </div>

  <script src="/assets/js/core/api.js"></script>
  <script src="/assets/js/core/page-transition.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error-box');
      const successBox = document.getElementById('success-box');
      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;

      try {
        await api.post('/auth/forgot-password',
          { email: document.getElementById('email').value.trim() },
          { skipAuth: true });
        successBox.textContent = "Si cet email existe, un lien de réinitialisation vient d'être envoyé.";
        successBox.classList.add('visible');
      } catch (err) {
        errorBox.textContent = err.status === 404
          ? "Cette route n'est pas encore implémentée côté backend (voir note de livraison)."
          : (err.message || 'Une erreur est survenue.');
        errorBox.classList.add('visible');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
